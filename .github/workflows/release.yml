name: Validate and stage desktop release

# Version tags only. v<VERSION>-check.N validates; v<VERSION> stages a draft.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      public-key: ${{ steps.signing.outputs.public-key }}
      create-draft: ${{ steps.signing.outputs.create-draft }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'cryptography==50.0.2'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate build tag and derive optional update verification key
        id: signing
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BENGA_UPDATE_SIGNING_KEY: ${{ secrets.BENGA_UPDATE_SIGNING_KEY }}
        run: |
          release_tag="$RELEASE_TAG"
          if [[ "$RELEASE_TAG" =~ ^(.+)-check\.[1-9][0-9]*$ ]]; then
            release_tag="${BASH_REMATCH[1]}"
            echo "create-draft=false" >> "$GITHUB_OUTPUT"
          else
            echo "create-draft=true" >> "$GITHUB_OUTPUT"
          fi
          python scripts/release_metadata.py validate-tag "$release_tag"
          if [[ -n "$BENGA_UPDATE_SIGNING_KEY" ]]; then
            public_key=$(python scripts/release_metadata.py public-key)
            echo "public-key=$public_key" >> "$GITHUB_OUTPUT"
          else
            echo '::warning::No update signing key: native package validation will run, but a release draft cannot be created.'
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      BENGA_UPDATE_PUBLIC_KEY: ${{ needs.prepare.outputs.public-key }}
      MACOSX_DEPLOYMENT_TARGET: '14.6'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libasound2-dev libpulse-dev libudev-dev pkg-config libvulkan1 mesa-vulkan-drivers
      - name: Windows SDK compiler environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bengaVsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $bengaVsPath) { throw 'Visual Studio C++ tools were not found' }
          & $env:COMSPEC /s /c "`"$bengaVsPath\Common7\Tools\VsDevCmd.bat`" -no_logo -arch=x64 -host_arch=x64 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $bengaName, $bengaValue = $Matches[1], $Matches[2]
              if ([Environment]::GetEnvironmentVariable($bengaName) -cne $bengaValue) {
                "$bengaName=$bengaValue" >> $env:GITHUB_ENV
              }
            }
          }
          if ($LASTEXITCODE -ne 0) { throw 'Visual Studio environment setup failed' }
      - name: Statically link the Windows C runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV'
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build native packages
        run: python scripts/package.py --target ${{ matrix.target }}
      - name: Validate native archives and installers
        run: python scripts/validate_package.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: benga-${{ matrix.target }}
          path: target/packages/*
          if-no-files-found: error
          retention-days: 3

  draft:
    needs: [prepare, build]
    if: needs.prepare.outputs.create-draft == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      BENGA_UPDATE_PUBLIC_KEY: ${{ needs.prepare.outputs.public-key }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: benga-*
          path: target/release-assets
          merge-multiple: true
      - run: python -m pip install --disable-pip-version-check 'cryptography==50.0.2'
      - name: Sign the complete release manifest
        env:
          BENGA_UPDATE_SIGNING_KEY: ${{ secrets.BENGA_UPDATE_SIGNING_KEY }}
        run: |
          test -n "$BENGA_UPDATE_PUBLIC_KEY" || { echo '::error::Configure BENGA_UPDATE_SIGNING_KEY and rerun the workflow to rebuild packages with update verification before staging a release.'; exit 1; }
          python scripts/release_metadata.py create target/release-assets --tag "$RELEASE_TAG" --repository "$GH_REPO"
      - name: Stage the complete draft for review
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > target/release-state.json 2>/dev/null; then
            python -c 'import json; assert json.load(open("target/release-state.json"))["isDraft"], "Refusing to overwrite a published release"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Benga $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" target/release-assets/* --clobber
          echo "Draft staged. Review native install, GPU and audio behavior before publishing manually." >> "$GITHUB_STEP_SUMMARY"
