name: Build and publish desktop release

# v<VERSION>-check.N validates packages. v<VERSION> publishes a release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.created
    runs-on: ubuntu-22.04
    outputs:
      public-key: ${{ steps.signing.outputs.public-key }}
      publish: ${{ steps.signing.outputs.publish }}
      matrix: ${{ steps.targets.outputs.matrix }}
      platforms: ${{ steps.targets.outputs.platforms }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: python -m pip install --disable-pip-version-check 'cryptography==50.0.2'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Select release targets
        id: targets
        env:
          BENGA_PAUSED_RELEASE_TARGETS: 'x86_64-apple-darwin aarch64-unknown-linux-gnu'
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from scripts.package import PLATFORMS

          runners = {
              "aarch64-apple-darwin": "macos-15",
              "x86_64-apple-darwin": "macos-15-intel",
              "x86_64-pc-windows-msvc": "windows-2022",
              "x86_64-unknown-linux-gnu": "ubuntu-22.04",
              "aarch64-unknown-linux-gnu": "ubuntu-22.04-arm",
          }
          paused = set(os.environ["BENGA_PAUSED_RELEASE_TARGETS"].split())
          if unknown := paused - runners.keys():
              raise SystemExit(f"Unknown paused release targets: {', '.join(sorted(unknown))}")
          enabled = [target for target in runners if target not in paused]
          if not enabled:
              raise SystemExit("At least one release target must be enabled")
          matrix = {"include": [{"runner": runners[target], "target": target} for target in enabled]}
          print("matrix=" + json.dumps(matrix))
          print("platforms=" + " ".join(PLATFORMS[target] for target in enabled))
          PY
      - name: Validate build tag and derive optional update verification key
        id: signing
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BENGA_UPDATE_SIGNING_KEY: ${{ secrets.BENGA_UPDATE_SIGNING_KEY }}
        run: |
          release_tag="$RELEASE_TAG"
          if [[ "$RELEASE_TAG" =~ ^(.+)-check\.[1-9][0-9]*$ ]]; then
            release_tag="${BASH_REMATCH[1]}"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          python scripts/release_metadata.py validate-tag "$release_tag"
          if [[ -n "$BENGA_UPDATE_SIGNING_KEY" ]]; then
            public_key=$(python scripts/release_metadata.py public-key)
            echo "public-key=$public_key" >> "$GITHUB_OUTPUT"
          else
            echo '::warning::No update signing key: native package validation will run, but publishing requires a signed update manifest.'
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      BENGA_UPDATE_PUBLIC_KEY: ${{ needs.prepare.outputs.public-key }}
      MACOSX_DEPLOYMENT_TARGET: '14.6'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libasound2-dev libpulse-dev libudev-dev pkg-config libvulkan1 mesa-vulkan-drivers
      - name: Windows SDK compiler environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bengaVsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $bengaVsPath) { throw 'Visual Studio C++ tools were not found' }
          & $env:COMSPEC /s /c "`"$bengaVsPath\Common7\Tools\VsDevCmd.bat`" -no_logo -arch=x64 -host_arch=x64 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $bengaName, $bengaValue = $Matches[1], $Matches[2]
              if ([Environment]::GetEnvironmentVariable($bengaName) -cne $bengaValue) {
                "$bengaName=$bengaValue" >> $env:GITHUB_ENV
              }
            }
          }
          if ($LASTEXITCODE -ne 0) { throw 'Visual Studio environment setup failed' }
      - name: Statically link the Windows C runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV'
      - name: Test
        run: cargo test --locked --release --target ${{ matrix.target }}
      - name: Build native packages
        run: python scripts/package.py --target ${{ matrix.target }}
      - name: Validate native archives and installers
        run: python scripts/validate_package.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: benga-${{ matrix.target }}
          path: target/packages/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      BENGA_UPDATE_PUBLIC_KEY: ${{ needs.prepare.outputs.public-key }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - uses: actions/download-artifact@v8
        with:
          pattern: benga-*
          path: target/release-assets
          merge-multiple: true
      - run: python -m pip install --disable-pip-version-check 'cryptography==50.0.2'
      - name: Sign the release manifest
        env:
          BENGA_UPDATE_SIGNING_KEY: ${{ secrets.BENGA_UPDATE_SIGNING_KEY }}
          RELEASE_PLATFORMS: ${{ needs.prepare.outputs.platforms }}
        run: |
          test -n "$BENGA_UPDATE_PUBLIC_KEY" || { echo '::error::Configure BENGA_UPDATE_SIGNING_KEY and rerun the workflow to rebuild packages with update verification before publishing.'; exit 1; }
          read -r -a release_platforms <<< "$RELEASE_PLATFORMS"
          python scripts/release_metadata.py create target/release-assets --tag "$RELEASE_TAG" --repository "$GH_REPO" --platforms "${release_platforms[@]}"
      - name: Upload packages and publish
        shell: bash
        run: |
          if is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$is_draft" == false ]]; then
              echo "Benga $RELEASE_TAG is already published." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Benga $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" target/release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --verify-tag --draft=false
          echo "Published [Benga $RELEASE_TAG]($GITHUB_SERVER_URL/$GH_REPO/releases/tag/$RELEASE_TAG)." >> "$GITHUB_STEP_SUMMARY"
