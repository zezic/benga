[package]
name = "benga"
version = "0.1.4"
edition = "2021"
license = "GPL-2.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
flate2 = "1.1.11"
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18.2"
cpu-time = "1.0.0"
directories = "6.0.0"
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names"] }
log = "0.4.35"
pretty_env_logger = "0.5.0"
quick-xml = "0.42.0"
pollster = "1.0.2"
png = "0.18.1"
parley = { version = "0.13.0", default-features = false, features = ["std", "bytemuck"] }
rayon = "1.12.0"
ron = "0.12.3"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
semver = "1.0.28"
sha2 = "0.11.1"
skrifa = "0.50.0"
strum = { version = "0.28.0", features = ["derive"] }
tar = "0.4.46"
tempfile = "3.27.0"
ureq = "3.5.2"
zip = { version = "9.6.1", default-features = false, features = ["deflate"] }
vello = "0.12.0"
winit = "0.30.13"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow", "NSView", "NSButton", "NSControl", "NSResponder", "objc2-core-foundation"] }
coreaudio = { version = "0.6.2", features = ["process-tap"] }
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSUUID", "NSGeometry", "NSProcessInfo"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Dwm", "Win32_UI_Controls"] }
