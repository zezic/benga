# Benga bootstrap: maintenance only. Website publication needs design approval.
server {
    listen 80;
    listen [::]:80;
    server_name benga.zezic.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/benga/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name benga.zezic.ru;
    ssl_certificate /etc/letsencrypt/live/benga.zezic.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/benga.zezic.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/benga.access.log;
    error_log /var/log/nginx/benga.error.log;

    location / { return 503; }
}
