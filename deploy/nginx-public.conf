# REVIEW COPY ONLY: install only after the website design is approved.
server {
    listen 80;
    listen [::]:80;
    server_name benga.zezic.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /srv/benga/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://benga.zezic.ru$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name benga.zezic.ru;
    ssl_certificate /etc/letsencrypt/live/benga.zezic.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/benga.zezic.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/benga/site;
    index index.html;
    sendfile on;
    access_log /var/log/nginx/benga.access.log;
    error_log /var/log/nginx/benga.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /downloads/latest.json {
        alias /srv/benga/downloads/current/latest.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /downloads/latest.json.sig {
        alias /srv/benga/downloads/current/latest.json.sig;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /install-macos.sh {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }
    location /downloads/ {
        alias /srv/benga/downloads/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ (^|/)\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
